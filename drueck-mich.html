<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Drück mich">
<meta name="theme-color" content="#ff8a5c">
<title>Drück mich!</title>
<style>
/* =========================================================
   ✏️  SPIELINHALTE stehen weiter unten im <script> unter
       const DEFAULT_SPIEL = { ... } – das sind die Standardinhalte.
       Jede:r kann sie zusätzlich über ⚙️ Einstellungen nur für
       das eigene Gerät ändern (gespeichert im localStorage).
   ========================================================= */
:root{
  --paper:#fffdf6;
  --paper-back:#f3ead6;
  --ink:#2b2a33;
  --grid:rgba(90,140,200,.13);
  --hand:"Chalkboard SE","Marker Felt","Comic Sans MS","Segoe Print","Bradley Hand",cursive;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{
  font-family:var(--hand);color:var(--ink);
  background:radial-gradient(120% 80% at 20% 0%,#ffd28a 0%,#ff9a6b 45%,#e8607e 100%);
  min-height:100vh;min-height:100dvh;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:manipulation;
}
/* dezente Konfetti-Punkte im Hintergrund */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
  background-image:
    radial-gradient(circle,#fff 1.5px,transparent 2px),
    radial-gradient(circle,#fff6 1px,transparent 1.5px);
  background-size:46px 46px,23px 23px;background-position:0 0,11px 17px;
}
#app{
  position:relative;height:100vh;height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  padding:calc(var(--sat) + 14px) 16px calc(var(--sab) + 14px);
}
header{text-align:center;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.12);flex:0 0 auto}
header h1{margin:0;font-size:clamp(28px,8vw,40px);letter-spacing:.5px;transform:rotate(-2deg)}
#trail{
  min-height:30px;margin-top:6px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;
  font-size:14px;
}
.chip{
  background:rgba(255,255,255,.9);color:var(--ink);border-radius:999px;padding:4px 10px;
  box-shadow:0 2px 6px rgba(0,0,0,.12);animation:pop .35s cubic-bezier(.3,1.6,.5,1) both;
}
.chip-arrow{color:#fff;align-self:center;animation:pop .35s both}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

#stage{flex:1 1 auto;width:100%;display:flex;align-items:center;justify-content:center;position:relative}

/* ---------- Papier ---------- */
.wrap{
  position:relative;
  width:min(92vw,440px);
  height:min(66vh,560px);height:min(66dvh,560px);
  perspective:1400px;-webkit-perspective:1400px;
}
.sheet,.paperface{
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
}
.sheet{
  position:absolute;inset:0;border-radius:6px;
  box-shadow:0 18px 40px rgba(90,20,40,.35),0 3px 8px rgba(0,0,0,.15);
  overflow:hidden;
}
/* Knickfalten, die sich mit jedem Aufklappen ansammeln */
.crease{position:absolute;pointer-events:none}
.crease.v{top:0;bottom:0;left:50%;width:2px;margin-left:-1px;
  background:linear-gradient(90deg,rgba(0,0,0,.07),rgba(255,255,255,.9),rgba(0,0,0,.05))}
.crease.h{left:0;right:0;top:50%;height:2px;margin-top:-1px;
  background:linear-gradient(rgba(0,0,0,.07),rgba(255,255,255,.9),rgba(0,0,0,.05))}
.crease.v2{top:0;bottom:0;left:25%;width:2px;background:linear-gradient(90deg,rgba(0,0,0,.05),rgba(255,255,255,.8))}
.crease.v3{top:0;bottom:0;left:75%;width:2px;background:linear-gradient(90deg,rgba(0,0,0,.05),rgba(255,255,255,.8))}

.content{
  position:absolute;inset:0;padding:22px 18px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  text-align:center;
}
.q{font-size:clamp(22px,6.4vw,30px);line-height:1.2;margin:0;max-width:95%}
.hint{font-size:15px;opacity:.6;margin:0}

/* Klappe für die Aufklapp-Animation */
.flap{position:absolute;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;z-index:5;pointer-events:none}
.flap-x{top:0;bottom:0;left:50%;width:50%;transform-origin:0 50%}
.flap-y{left:0;right:0;top:50%;height:50%;transform-origin:50% 0}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{background:var(--paper-back);
  background-image:linear-gradient(135deg,rgba(255,255,255,.35),rgba(0,0,0,.06));
  box-shadow:inset 0 0 18px rgba(120,80,30,.18)}
.flap-x .face.back{transform:rotateY(180deg);border-radius:6px 0 0 6px}
.flap-y .face.back{transform:rotateX(180deg);border-radius:6px 6px 0 0}
.face .clone{position:absolute}
.shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}

/* ---------- Auswahl-Knöpfe ---------- */
.btn{
  font-family:inherit;color:var(--ink);border:none;cursor:pointer;
  border-radius:16px;padding:14px 10px;font-size:clamp(18px,5vw,22px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .12s,box-shadow .12s;
  position:relative;
}
.btn:active{transform:translateY(3px) scale(.97);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn .em{font-size:clamp(34px,10vw,46px);line-height:1}
.btn.picked{animation:picked .5s ease both;z-index:2}
@keyframes picked{0%{transform:scale(1)}40%{transform:scale(1.15) rotate(-3deg)}100%{transform:scale(1.06)}}
.btn.dim{opacity:.35;transition:opacity .3s}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}
.grid2.tall .btn{min-height:min(22vh,150px)}
.moods .btn{min-height:min(30vh,220px);font-size:clamp(22px,6.4vw,28px)}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:100%}
.nums .btn{aspect-ratio:1;padding:0;font-size:clamp(24px,7.5vw,32px);border-radius:50%}

/* Marker-Farben */
.c0{background:#ffe066}.c1{background:#8fd3ff}.c2{background:#b8f2a0}.c3{background:#ffb3c7}
.c4{background:#d5b8ff}.c5{background:#ffc98b}

/* ---------- Intro (gefaltetes Papier) ---------- */
.folded{
  width:min(52vw,220px);aspect-ratio:1;position:relative;cursor:pointer;
  animation:wobble 2.4s ease-in-out infinite;
}
.folded .sq{position:absolute;inset:0;border-radius:6px;
  box-shadow:0 18px 30px rgba(90,20,40,.35)}
.folded .sq::before,.folded .sq::after{content:"";position:absolute;background:rgba(0,0,0,.08)}
.folded .sq::before{left:0;right:0;top:50%;height:1px}
.folded .sq::after{top:0;bottom:0;left:50%;width:1px}
.folded .corner{
  position:absolute;right:0;bottom:0;width:28%;height:28%;
  background:linear-gradient(135deg,var(--paper-back) 50%,transparent 50%);
  filter:drop-shadow(-2px -2px 3px rgba(0,0,0,.12));border-radius:0 0 6px 0;
}
.folded .label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:clamp(24px,7vw,32px);transform:rotate(-6deg)}
.folded .label small{font-size:15px;opacity:.6;margin-top:6px}
@keyframes wobble{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-10px)}}
.tapme{position:absolute;bottom:-56px;left:50%;transform:translateX(-50%);color:#fff;font-size:18px;white-space:nowrap;
  animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.4}}

/* ---------- Zählen ---------- */
.counter{
  position:absolute;left:50%;top:50%;z-index:20;pointer-events:none;
  width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;
  background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;font-size:64px;
}
.counter.tick{animation:tick .32s ease}
@keyframes tick{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.wrap.pump{animation:pump .32s ease}
@keyframes pump{0%,100%{transform:scale(1,1)}45%{transform:scale(.9,1.04)}}

/* ---------- Ergebnis ---------- */
.result .big{font-size:clamp(84px,26vw,120px);line-height:1;animation:bounceIn .8s .25s cubic-bezier(.3,1.7,.5,1) both}
.result .pre{font-size:clamp(18px,5vw,22px);opacity:.7;margin:0;animation:fadeUp .5s .5s both}
.result .answer{font-size:clamp(28px,8.5vw,40px);margin:0;line-height:1.15;
  background:linear-gradient(transparent 58%,#ffe066 58%,#ffe066 90%,transparent 90%);
  padding:0 6px;animation:fadeUp .6s .7s both}
.result .path{font-size:14px;opacity:.55;animation:fadeUp .5s .9s both}
.actions{display:flex;gap:10px;animation:fadeUp .5s 1.1s both;flex-wrap:wrap;justify-content:center}
.actions .btn{flex-direction:row;font-size:18px;padding:12px 16px}
@keyframes bounceIn{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.leaving{animation:leave .28s ease forwards}
@keyframes leave{to{transform:scale(.85) rotate(-3deg);opacity:0}}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 24px);transform:translate(-50%,40px);opacity:0;
  background:#2b2a33;color:#fff;padding:10px 16px;border-radius:12px;font-size:16px;transition:.3s;z-index:60}
#toast.show{transform:translate(-50%,0);opacity:1}

/* ---------- Mehr Einträge → kompakter ---------- */
.moods.many .btn{min-height:min(19vh,140px);font-size:clamp(19px,5.4vw,24px)}
.content{overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ---------- Einstellungen ---------- */
.gear{position:fixed;top:calc(var(--sat) + 12px);right:14px;z-index:40;width:44px;height:44px;border-radius:50%;
  border:none;background:rgba(255,255,255,.88);font-size:22px;box-shadow:0 3px 10px rgba(0,0,0,.15);cursor:pointer;
  transition:transform .3s}
.gear:active{transform:rotate(90deg) scale(.92)}
#settings{position:fixed;inset:0;z-index:70;background:rgba(30,20,30,.5);display:none;align-items:flex-end;justify-content:center}
#settings.open{display:flex;animation:fadeIn .2s}
.panel{background:var(--paper);width:min(100%,560px);max-height:92vh;max-height:92dvh;border-radius:20px 20px 0 0;
  display:flex;flex-direction:column;animation:slideUp .32s cubic-bezier(.2,.9,.3,1);padding-bottom:var(--sab);
  -webkit-user-select:text;user-select:text;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(0,0,0,.08)}
.ph h2{margin:0;font-size:22px}
.pb{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 24px;flex:1}
.pf{display:flex;gap:8px;padding:12px 16px;border-top:1px solid rgba(0,0,0,.08)}
.panel h3{margin:20px 0 8px;font-size:18px}
.panel input,.panel select,.panel textarea{font-family:-apple-system,system-ui,sans-serif;font-size:16px;padding:9px 10px;
  border:1.5px solid rgba(0,0,0,.14);border-radius:10px;background:#fff;color:var(--ink);width:100%;min-width:0}
.panel textarea{resize:vertical;margin-top:6px}
.row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.row .emo{flex:0 0 54px;text-align:center}
.row .num{flex:0 0 22px;text-align:right;opacity:.55;font-size:15px}
.row .del{flex:0 0 42px;height:42px;border:none;background:#ffe1e1;border-radius:10px;font-size:18px;cursor:pointer}
.kat{border:1.5px dashed rgba(0,0,0,.15);border-radius:12px;padding:8px 8px 2px;margin-bottom:8px}
.sbtn{font-family:inherit;font-size:16px;border:none;border-radius:12px;padding:11px 14px;background:#eee;color:var(--ink);cursor:pointer}
.sbtn.primary{background:#ff8a5c;color:#fff;flex:1}
.sbtn.add{background:#e6f4ff;width:100%;margin-top:2px}
.sbtn.warn{background:#ffe1e1}
.sbtn.x{background:transparent;font-size:22px;padding:6px 10px}
.badge{font-size:13px;padding:3px 9px;border-radius:999px;background:#b8f2a0;opacity:1}
.small{font-size:13px;opacity:.7;margin:6px 0 8px;font-family:-apple-system,system-ui,sans-serif}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}}

@media (prefers-reduced-motion:reduce){
  .folded,.tapme{animation:none}
}
</style>

/* ---------- Konfiguration laden (eigene Version aus localStorage) ---------- */
const STORE_KEY = 'drueckmich.config.v1';
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => 'x' + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function normalize(cfg) {
  if (!cfg || !Array.isArray(cfg.stimmungen) || !Array.isArray(cfg.kategorien) || !cfg.stimmungen.length || !cfg.kategorien.length)
    throw new Error('ungültig');
  ['frage1', 'frage2', 'frage3'].forEach(f => { if (typeof cfg[f] !== 'string') cfg[f] = DEFAULT_SPIEL[f]; });
  cfg.stimmungen.forEach(m => { m.id = m.id || uid(); m.label = m.label ?? ''; m.emoji = m.emoji ?? ''; });
  cfg.kategorien.forEach(k => { k.id = k.id || uid(); k.label = k.label ?? ''; k.emoji = k.emoji ?? ''; k.satz = k.satz ?? 'Dein Ergebnis ist …'; });
  cfg.ergebnisse = cfg.ergebnisse || {};
  cfg.stimmungen.forEach(m => {
    const byCat = cfg.ergebnisse[m.id] = cfg.ergebnisse[m.id] || {};
    cfg.kategorien.forEach(k => {
      const arr = Array.isArray(byCat[k.id]) ? byCat[k.id] : [];
      for (let i = 0; i < 10; i++) {
        const e = Array.isArray(arr[i]) ? arr[i] : ['❓', ''];
        arr[i] = [String(e[0] ?? ''), String(e[1] ?? '')];
      }
      arr.length = 10; byCat[k.id] = arr;
    });
  });
  return cfg;
}
function loadConfig() {
  try {
    const s = localStorage.getItem(STORE_KEY);
    if (s) return { cfg: normalize(JSON.parse(s)), custom: true };
  } catch (e) {}
  return { cfg: normalize(clone(DEFAULT_SPIEL)), custom: false };
}
let { cfg: SPIEL, custom: isCustom } = loadConfig();

/* ---------- kleine Sounds (WebAudio, optional) ---------- */
let actx = null;
function beep(freq = 520, dur = .08, type = 'triangle', vol = .08) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
function rustle() { // Papier-Rascheln
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const len = actx.sampleRate * .35, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2) * (Math.random() < .3 ? 1 : .3);
    const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    f.type = 'highpass'; f.frequency.value = 1800; g.gain.value = .12;
    s.buffer = buf; s.connect(f).connect(g).connect(actx.destination); s.start();
  } catch (e) {}
}

    const a = document.createElement('span'); a.className = 'chip-arrow'; a.textContent = '→'; trail.appendChild(a);
  }

/* ---------- Papier aufklappen ---------- */
function creases(n) {
  return ['v', 'h', 'v2', 'v3'].slice(0, n).map(c => `<div class="crease ${c}"></div>`).join('');
}

async function showSheet(innerHTML, axis, creaseCount) {
  const old = stage.firstElementChild;
  if (old) { old.classList.add('leaving'); await sleep(reduce ? 0 : 260); old.remove(); }

  const wrap = document.createElement('div'); wrap.className = 'wrap';
  const sheet = document.createElement('div'); sheet.className = 'sheet';
  sheet.innerHTML = creases(creaseCount) + `<div class="content">${innerHTML}</div>`;
  wrap.appendChild(sheet);
  stage.appendChild(wrap);
  if (reduce || !axis) return wrap;

  const w = wrap.offsetWidth, h = wrap.offsetHeight;
  const clip = axis === 'x' ? 'inset(0 50% 0 0 round 6px)' : 'inset(0 0 50% 0 round 6px)';
  sheet.style.clipPath = clip; sheet.style.webkitClipPath = clip;

  const flap = document.createElement('div'); flap.className = 'flap flap-' + axis;
  const front = document.createElement('div'); front.className = 'face front';
  const clone = document.createElement('div'); clone.className = 'clone sheet';
  clone.style.cssText = `width:${w}px;height:${h}px;box-shadow:none;` +
    (axis === 'x' ? `left:${-w / 2}px;top:0` : `top:${-h / 2}px;left:0`);
  clone.innerHTML = sheet.innerHTML;
  const shade = document.createElement('div'); shade.className = 'shade';
  front.append(clone, shade);
  const back = document.createElement('div'); back.className = 'face back';
  flap.append(front, back);
  wrap.appendChild(flap);

  const from = axis === 'x' ? 'rotateY(-180deg)' : 'rotateX(180deg)';
  const to = axis === 'x' ? 'rotateY(0deg)' : 'rotateX(0deg)';
  rustle();
  const opts = { duration: 750, easing: 'cubic-bezier(.45,0,.25,1)', fill: 'both' };
  const a = flap.animate([{ transform: from }, { transform: to }], opts);
  shade.animate([{ opacity: .45 }, { opacity: 0 }], opts);
  wrap.animate([{ transform: 'scale(.94)' }, { transform: 'scale(1.02)', offset: .7 }, { transform: 'scale(1)' }],
    { duration: 750, easing: 'ease-out' });
  await a.finished;
  sheet.style.clipPath = 'none'; sheet.style.webkitClipPath = 'none';
  flap.remove();
  return wrap;
}

function pickAnim(btn) {

async function step3() {

async function countUp(wrap, n) {
  const c = document.createElement('div'); c.className = 'counter';
  wrap.appendChild(c);
  for (let i = 1; i <= n; i++) {
    c.textContent = i;
    c.classList.remove('tick'); void c.offsetWidth; c.classList.add('tick');
    wrap.classList.remove('pump'); void wrap.offsetWidth; wrap.classList.add('pump');
    beep(400 + i * 45, .09);
    await sleep(reduce ? 120 : 340);
  }
  await sleep(350);
}

async function step4() {
  const list = SPIEL.ergebnisse[state.mood.id]?.[state.cat.id] || [];
  const [emoji, text] = list[state.num - 1] || ['❓', '(kein Eintrag)'];
  state.result = { emoji, text };
  const html = `
    <div class="result content" style="position:static;padding:0">

  const wrap = await showSheet(html, 'y', 4);

  });
}

function fanfare() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .18, 'square', .05), i * 120)); }

function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1600);
}

/* ---------- Konfetti ---------- */
function confetti() {
  if (reduce) return;
  const cv = document.getElementById('confetti'), ctx = cv.getContext('2d');
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cols = ['#ffe066', '#8fd3ff', '#b8f2a0', '#ffb3c7', '#d5b8ff', '#ff8a5c', '#fff'];
  const P = Array.from({ length: 140 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .45,
    vx: (Math.random() - .5) * 14, vy: -Math.random() * 15 - 5,
    r: Math.random() * 6 + 4, rot: Math.random() * 6, vr: (Math.random() - .5) * .4,
    c: cols[Math.random() * cols.length | 0], s: Math.random() < .5
  }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    P.forEach(p => {
      p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c;
      if (p.s) ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
      else { ctx.beginPath(); ctx.arc(0, 0, p.r / 2.4, 0, 7); ctx.fill(); }
      ctx.restore();
    });
    if (t - t0 < 3500) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

sBody.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (d.f) draft[d.f] = t.value;
  else if (d.list) draft[d.list][+d.i][d.k] = t.value;
  else if (d.res !== undefined) draft.ergebnisse[resSel.m][resSel.k][+d.res][+d.p] = t.value;
});
sBody.addEventListener('change', e => {
  if (e.target.id === 'selM') { resSel.m = e.target.value; renderSettings(); }
  if (e.target.id === 'selK') { resSel.k = e.target.value; renderSettings(); }
});
sBody.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.del) {
    const list = draft[d.del];
    if (list.length <= 1) return toast('Mindestens ein Eintrag wird gebraucht');
    const [gone] = list.splice(+d.i, 1);
    if (d.del === 'stimmungen') delete draft.ergebnisse[gone.id];
    else Object.values(draft.ergebnisse).forEach(byCat => delete byCat[gone.id]);
    renderSettings();
  } else if (d.add) {
    const neu = d.add === 'stimmungen'
      ? { id: uid(), label: 'Neue Stimmung', emoji: '⭐' }
      : { id: uid(), label: 'Neues Thema', emoji: '⭐', satz: 'Dein Ergebnis ist …' };
    draft[d.add].push(neu);
    normalize(draft);
    if (d.add === 'stimmungen') resSel.m = neu.id; else resSel.k = neu.id;
    renderSettings();
    toast('Hinzugefügt – Ergebnisse unten eintragen');
  } else if (t.id === 'exp') {
    const txt = JSON.stringify(normalize(draft));
    try { await navigator.clipboard.writeText(txt); toast('Kopiert! 📋'); }
    catch (err) { const ta = $('#impText'); ta.value = txt; ta.focus(); ta.select(); toast('Text markiert – bitte kopieren'); }
  } else if (t.id === 'imp') {
    try {
      draft = normalize(JSON.parse($('#impText').value.trim()));
      resSel = { m: draft.stimmungen[0].id, k: draft.kategorien[0].id };
      renderSettings(); toast('Importiert – jetzt Speichern tippen');
    } catch (err) { toast('Das sieht nicht nach einer gültigen Konfiguration aus'); }
  } else if (t.id === 'reset') {
    if (!t.dataset.armed) { t.dataset.armed = 1; t.textContent = 'Wirklich? Nochmal tippen'; return; }
    try { localStorage.removeItem(STORE_KEY); } catch (err) {}
    SPIEL = normalize(clone(DEFAULT_SPIEL)); isCustom = false;
    closeSettings(); intro(); toast('Standard wiederhergestellt');
  }
});

$('#sSave').addEventListener('click', () => {
  SPIEL = normalize(draft);
  try { localStorage.setItem(STORE_KEY, JSON.stringify(SPIEL)); isCustom = true; toast('Gespeichert ✓'); }
  catch (err) { toast('Speichern hier nicht möglich – gilt bis zum Neuladen'); }
  closeSettings(); intro();
});
$('#sCancel').addEventListener('click', closeSettings);
$('#sClose').addEventListener('click', closeSettings);
sEl.addEventListener('click', e => { if (e.target === sEl) closeSettings(); });
$('#gear').addEventListener('click', openSettings);

intro();
</script>
</body>
</html>
